name: tr1-DH

on:
  schedule:
    # 하루 3번, 트리거당 1개씩만 업로드(깃허브 스케줄 지연 최대 2시간 감안해 앞당겨둠)
    - cron: '0 12 * * *'   # 21:00 KST 트리거 -> 실제 게시 목표 23:00 KST(터키 17:00)
    - cron: '0 14 * * *'   # 23:00 KST 트리거 -> 실제 게시 목표 01:00 KST(익일, 터키 19:00)
    - cron: '0 16 * * *'   # 01:00 KST(익일) 트리거 -> 실제 게시 목표 03:00 KST(익일, 터키 21:00)
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      target:
        description: '지정 업로드할 번호 (비우면 랜덤 선택)'
        required: false
        default: ''

concurrency:
  group: tr1-dh-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 설정 파일 생성
        env:
          CONFIG_B64: ${{ secrets.YT6S_CONFIG }}
        run: echo "$CONFIG_B64" | tr -d '[:space:]' | base64 -d > yt6s_config.py

      - name: 쇼츠 업로드 실행 (1건)
        run: python yt6s_upload.py tr1 "${{ github.event.inputs.target }}"
